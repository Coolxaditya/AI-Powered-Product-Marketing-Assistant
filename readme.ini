 AI-Powered Product Marketing Assistant
Supercharge your marketing creativity with AI-Powered Product Marketing Assistant — an intelligent tool designed to craft product descriptions, ad copies, and catchy slogans effortlessly.

Built for startups, marketers, and entrepreneurs who want smarter content, faster.

✨ What It Does
🛍️ Instantly generate product descriptions tailored to different audiences.

🧠 Create ad copies and slogans that boost engagement.

🎯 Adjust tone and style to match your brand (professional, casual, witty, etc.).

📄 Export your marketing content easily.

🛠️ Tech Stack
Python 3.8+

Streamlit — For building the interactive web app

CrewAI — For orchestrating AI tasks

LangChain — For managing prompt pipelines and outputs

textwrap — For clean and readable text formatting

langchain_groq — For leveraging Groq-powered AI models

dotenv — For securely handling API keys

reportlab — For optional PDF generation

🚀 Getting Started
git clone https://github.com/Coolxaditya/AI-Powered-Product-Marketing-Assistant.git
cd AI-Powered-Product-Marketing-Assistant
pip install -r requirements.txt
streamlit run app.py

